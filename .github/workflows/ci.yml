name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check that the plugin build does not depend on Node.js globals
        run: "! grep -n 'process\\.env' packages/plugin/dist/main.js"
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  plugin-size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @obsttorte/plugin build
      - name: Compare plugin size
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          size=$(wc -c < packages/plugin/dist/main.js)
          echo "main.js is ${size} bytes"
          baseline=$(gh release view --json assets --jq '.assets[] | select(.name=="main.js") | .size' 2>/dev/null | head -n 1 || true)
          if [ -z "$baseline" ] && [ -f packages/plugin/main-size-baseline ]; then
            baseline=$(cat packages/plugin/main-size-baseline)
          fi
          if [ -n "$baseline" ]; then
            limit=$((baseline * 110 / 100))
            if [ "$size" -gt "$limit" ]; then
              echo "::warning::main.js grew more than 10% from ${baseline} to ${size}"
            fi
          fi
