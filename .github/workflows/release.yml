name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm changeset publish
          # Obsidianが読むx.y.zのリリースを次のstepで1つだけ作る
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Attest the plugin files
        if: steps.changesets.outputs.published == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            packages/plugin/dist/main.js
            packages/plugin/dist/manifest.json
            packages/plugin/dist/styles.css
      - name: Create the GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          sha256sum \
            packages/plugin/dist/main.js \
            packages/plugin/dist/manifest.json \
            packages/plugin/dist/styles.css \
            packages/cli/bin/obsttorte.mjs \
            packages/cli/dist/obsttorte/index.js \
            > SHA256SUMS
          node scripts/release-notes.mjs "$version" SHA256SUMS > release-notes.md
          gh release create "$version" \
            --title "$version" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            packages/plugin/dist/main.js \
            packages/plugin/dist/manifest.json \
            packages/plugin/dist/styles.css
